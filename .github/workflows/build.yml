name: Build PhoneLock

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build PC app (PhoneLock.exe)
        run: bash pc/build.sh

      - name: Build phone app (PhoneLock.apk)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/PhoneLock.apk
          cp pc/dist/PhoneLock.exe out/PhoneLock.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneLock-build-${{ github.run_number }}
          path: out/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/PhoneLock.apk out/PhoneLock.exe \
            --target "${{ github.sha }}" \
            --title "PhoneLock build ${{ github.run_number }}" \
            --notes "PhoneLock.apk → install on your phone. PhoneLock.exe → run on your PC." \
            --latest
